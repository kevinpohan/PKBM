[package]
name = "pkbm-presensi"
version = "1.0.0"
description = "Sistem Presensi Digital PKBM Karawang"

[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app/" = "."

[[command]]
name = "web"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "0.0.0.0:8080", "/app/server.php"]
